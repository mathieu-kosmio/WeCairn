name: Tests

# Tests d'intégration (instance PocketBase jetable, faux fournisseur IA) et construction de l'image
# Docker, sur chaque push sur main et chaque pull request. Le build valide le Dockerfile, dont
# l'empreinte SHA-256 épinglée de l'archive PocketBase et l'exécution du conteneur sans les droits root.

on:
  push:
    branches:
      - main
  pull_request:

# Le jeton n'a besoin que de lire le code.
permissions:
  contents: read

jobs:
  api:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: make test
        run: make test

  image:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t wecairn:ci .

      - name: Vérifier que PocketBase ne tourne pas en root
        run: |
          # L'entrypoint bascule vers l'utilisateur « pb » : le processus pocketbase ne doit pas être root.
          cid=$(docker run -d -p 8090:8090 wecairn:ci)
          for i in $(seq 1 30); do
            docker exec "$cid" wget -q -O /dev/null http://127.0.0.1:8090/api/health && break
            sleep 1
          done
          user=$(docker exec "$cid" sh -c 'ps -o user= -p "$(pgrep -f "/pb/pocketbase serve" | head -n1)"')
          echo "PocketBase tourne sous l'utilisateur : $user"
          docker rm -f "$cid" >/dev/null
          test "$user" = "pb"
